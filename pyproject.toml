[project]
name = "pipeline"
version = "0.1.0"
description = "Aggregates product data from three heterogeneous upstream APIs into one normalized catalogue."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
# Supplied by the challenge; we do not own or reformat these.
extend-exclude = ["server.py", "test_server.py"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # import sorting
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "C4",               # comprehensions
    "RUF",
    "C901",             # complexity
    "PLR0912",          # too many branches
    "PLR0915",          # too many statements
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 8
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
